      <h1>Alice Giubergia</h1>
      <p class="lede" data-en="I work on fMRI methods: acquisition, denoising, and the processing choices in between." data-it="Mi occupo di metodi fMRI: acquisizione, denoising, e le scelte di processing che stanno in mezzo."></p>
      <p class="bio" data-en="PhD in Information Engineering (bioengineering) and five years of neuroimaging work. My doctoral research was methodological: benchmarking multi-echo against single-echo EPI, testing denoising strategies, and measuring how preprocessing choices propagate into functional-connectivity estimates — three studies published as first author. I like owning a problem end to end: experimental design, acquisition in a clinical setting, Python and MATLAB pipelines, statistical modelling, and explaining the result to people who do not write code." data-it="Dottorato in Ingegneria dell'Informazione (bioingegneria) e cinque anni di lavoro nel neuroimaging. La mia ricerca di dottorato e stata metodologica: confronto tra EPI multi-echo e single-echo, strategie di denoising, e quanto le scelte di preprocessing si propaghino nelle stime di connettivita funzionale — tre studi pubblicati da primo autore. Mi piace seguire un problema dall'inizio alla fine: disegno sperimentale, acquisizione in ambito clinico, pipeline in Python e MATLAB, modellazione statistica, e spiegare il risultato a chi non scrive codice."></p>
      <p class="where" data-en="Research Engineer, Neuroimaging Lab, IRCCS Eugenio Medea — Associazione La Nostra Famiglia, Bosisio Parini (LC), Italy. Nine peer-reviewed articles, three as first author; conference contributions at OHBM, ISMRM and ESMRMB." data-it="Research Engineer, Neuroimaging Lab, IRCCS Eugenio Medea — Associazione La Nostra Famiglia, Bosisio Parini (LC). Nove articoli peer-reviewed, tre da primo autore; contributi a OHBM, ISMRM ed ESMRMB."></p>

    <section id="work">
      <h2 data-en="Selected work" data-it="Progetti selezionati"></h2>

      <article class="project">
        <h3 data-en="Multi-echo vs single-echo EPI for task fMRI" data-it="EPI multi-echo e single-echo per la fMRI da task"></h3>
        <p class="role" data-en="First author — Imaging Neuroscience, 2025" data-it="Prima autrice — Imaging Neuroscience, 2025"></p>
        <p data-en="Multi-echo acquisition promises cleaner signal, but at a cost in sequence complexity and processing. I ran the head-to-head comparison on task fMRI data so the choice could be made on evidence rather than on habit." data-it="L'acquisizione multi-echo promette un segnale più pulito, ma al prezzo di una sequenza e di un processing più complessi. Ho impostato il confronto diretto su dati di fMRI da task, per rendere la scelta una decisione basata su evidenza e non sull'abitudine."></p>
        <p class="out"><span data-en="Neither won outright: me-fmri came out ahead on subject-level reliability, while se-fmri came out ahead on activation magnitude and group-level statistical power." data-it="Nessuna delle due vince del tutto: me-fmri è superiore in affidabilità a livello di singolo soggetto, mentre se-fmri è superiore in ampiezza di attivazione e potenza statistica a livello di gruppo."></span></p>
        <ul class="tags"><li>MATLAB</li><li>SPM</li><li data-en="Multi-echo EPI" data-it="EPI multi-echo"></li><li data-en="Denoising" data-it="Denoising"></li><li data-en="Sequence benchmarking" data-it="Confronto tra sequenze"></li></ul>
      </article>

      <article class="project">
        <h3 data-en="How processing choices propagate into functional connectivity" data-it="Come le scelte di processing si propagano nella connettività funzionale"></h3>
        <p class="role" data-en="First author — Journal of Neuroscience Research, 2026" data-it="Prima autrice — Journal of Neuroscience Research, 2026"></p>
        <p data-en="Connectivity estimated from task-evoked data depends on a long chain of preprocessing decisions that are usually taken silently. I made that chain explicit and quantified how much each choice moves the final estimate." data-it="La connettività stimata da dati task-evoked dipende da una lunga catena di decisioni di preprocessing, di solito prese in silenzio. Ho reso esplicita quella catena e quantificato quanto ogni scelta sposti la stima finale."></p>
        <p class="out"><span data-en="Task regression doesn't remove task information from connectomes, but it does not change clinical group classification." data-it="La regressione del task non elimina l'informazione task dai connettomi, ma non cambia la classificazione dei gruppi clinici."></span></p>
        <ul class="tags"><li>Python</li><li data-en="ICA-based nuisance regression" data-it="Regressione dei confondenti via ICA"></li><li data-en="Functional connectivity" data-it="Connettivita funzionale"></li><li data-en="Group-level inference" data-it="Inferenza di gruppo"></li></ul>
      </article>

      <article class="project">
        <h3 data-en="Reading words that are hard to see" data-it="Leggere parole difficili da vedere"></h3>
        <p class="role" data-en="First author — Behavioral and Brain Functions, 2026" data-it="Prima autrice — Behavioral and Brain Functions, 2026"></p>
        <p data-en="I designed, implemented and validated an fMRI paradigm for visually degraded word reading — from programming the task to collecting the MR data — and used it to ask how the dorsal stream is recruited when recognition gets harder in a transparent orthography." data-it="Ho disegnato, implementato e validato un paradigma fMRI per la lettura di parole visivamente degradate — dalla programmazione del task all'acquisizione dei dati MR — e l'ho usato per studiare come viene reclutato lo stream dorsale quando il riconoscimento si fa piu difficile, in un'ortografia trasparente."></p>
        <p class="out" data-en="Published as first author; the paradigm is now reused in follow-up work in the lab." data-it="Pubblicato come prima autrice; il paradigma viene ora riutilizzato in lavori successivi del laboratorio."></p>
        <ul class="tags"><li data-en="Experimental design" data-it="Disegno sperimentale"></li><li>Presentation&reg;</li><li>SPM</li><li data-en="Task fMRI, GLM" data-it="fMRI da task, GLM"></li></ul>
      </article>

      <article class="project">
        <h3 data-en="A laminar fMRI pipeline at 7T" data-it="Una pipeline di fMRI laminare a 7T"></h3>
        <p class="role" data-en="Current work — supported by an AIRMM travel grant" data-it="Lavoro in corso — sostenuto da un AIRMM travel grant"></p>
        <p data-en="Layer-specific fMRI asks where inside the cortical ribbon a signal comes from, so the whole analysis rests on segmentation and depth sampling. I built the end-to-end pipeline with ANTs, FreeSurfer and LayNii, producing group-level cortical-depth activation profiles across ROIs." data-it="La fMRI laminare chiede in quale punto del nastro corticale nasce il segnale: tutta l'analisi poggia quindi su segmentazione e campionamento in profondita. Ho costruito la pipeline end-to-end con ANTs, FreeSurfer e LayNii, ottenendo profili di attivazione in profondita corticale a livello di gruppo su piu ROI."></p>
        <ul class="tags"><li>ANTs</li><li>FreeSurfer</li><li>LayNii</li><li>7T</li><li data-en="Surface-based analysis" data-it="Analisi su superficie"></li></ul>
      </article>

    </section>

<script>
(function(){
  var nodes = document.querySelectorAll('[data-en]');
  var btnEn = document.getElementById('btn-en');
  var btnIt = document.getElementById('btn-it');

  function setLang(lang){
    for (var i=0;i<nodes.length;i++){
      var v = nodes[i].dataset[lang];
      if (v) nodes[i].textContent = v;
    }
    document.documentElement.lang = lang;
    btnEn.setAttribute('aria-pressed', String(lang === 'en'));
    btnIt.setAttribute('aria-pressed', String(lang === 'it'));
  }

  btnEn.addEventListener('click', function(){ setLang('en'); });
  btnIt.addEventListener('click', function(){ setLang('it'); });

  setLang((navigator.language || 'en').slice(0,2) === 'it' ? 'it' : 'en');

  var items = document.querySelectorAll('.rail li');
  var map = {};
  for (var j=0;j<items.length;j++){
    var href = items[j].querySelector('a').getAttribute('href').slice(1);
    map[href] = items[j];
  }
  if ('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){
          for (var k=0;k<items.length;k++) items[k].classList.remove('on');
          if (map[e.target.id]) map[e.target.id].classList.add('on');
        }
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    ['about','work','skills','background','publications'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) obs.observe(el);
    });
  }
})();
</script>
